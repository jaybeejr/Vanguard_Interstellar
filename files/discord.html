<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing in | Vanguard Interstellar</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Teko:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <section style="padding:90px 0">
    <div class="wrap">
      <div class="panel" style="max-width:560px">
        <h3 id="title">SIGNING IN WITH DISCORD</h3>
        <p id="text" style="margin:0 0 16px;color:var(--gray)" role="status">One moment...</p>
        <div class="actions" style="margin-top:0"><a class="btn" id="back" href="index.html" hidden>BACK TO THE SITE</a></div>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  'use strict';
  var USERS_KEY = 'vanguardUsers', SESSION_KEY = 'vanguardSession';
  var $ = function (s) { return document.querySelector(s); };
  function fail(msg) { $('#title').textContent = 'SIGN-IN FAILED'; $('#text').textContent = msg; $('#back').hidden = false; }

  var hash = new URLSearchParams(location.hash.slice(1));
  var query = new URLSearchParams(location.search);
  var token = hash.get('access_token'), type = hash.get('token_type'), state = hash.get('state');
  var denied = hash.get('error') || query.get('error');
  history.replaceState(null, '', location.pathname); // remove the token from the address bar

  var want, back = 'index.html', remember = false;
  try {
    want = sessionStorage.getItem('vanguardDiscordState');
    back = sessionStorage.getItem('vanguardDiscordReturn') || 'index.html';
    remember = sessionStorage.getItem('vanguardDiscordRemember') === '1';
    ['vanguardDiscordState', 'vanguardDiscordReturn', 'vanguardDiscordRemember'].forEach(function (k) { sessionStorage.removeItem(k); });
  } catch (e) {}
  if (!/^[A-Za-z0-9_-]+\.html$/.test(back)) back = 'index.html';
  $('#back').href = back;

  if (denied) return fail('Discord sign-in was cancelled. You can try again from the ACCOUNT menu.');
  if (!token || !state || !want || state !== want) return fail('This sign-in link is not valid or has expired. Please start again from the ACCOUNT menu.');
  if (type !== 'Bearer') return fail('Discord sent an unexpected response. Please try again.');

  fetch('https://discord.com/api/users/@me', { headers: { Authorization: 'Bearer ' + token } })
    .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
    .then(function (u) {
      token = null; // the token is only used once and never saved
      var id = String(u && u.id || '');
      var name = String(u && u.username || '').replace(/[^A-Za-z0-9_.-]/g, '').slice(0, 32);
      if (!/^\d{5,30}$/.test(id)) throw new Error('bad');
      if (!name) name = 'discord' + id.slice(-4);
      var all; try { all = JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); } catch (e) { all = {}; }
      if (!all || typeof all !== 'object') all = {};
      var key = name.toLowerCase(), old = all[key];
      if (old && !old.discord) return fail('A username and password account called "' + name + '" already exists on this device. Log in with its password instead.');
      all[key] = { name: name, discord: true, discordId: id, created: old && old.created ? old.created : Date.now() };
      try {
        localStorage.setItem(USERS_KEY, JSON.stringify(all));
        sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_KEY);
        (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, JSON.stringify(name));
      } catch (e) { return fail('This browser blocked saving. Allow site storage and try again.'); }
      $('#text').textContent = 'Signed in as ' + name + '. Taking you back...';
      location.replace(back);
    })
    .catch(function () { fail('Could not read your Discord account. Please try again.'); });
})();
</script>
</body>
</html>
